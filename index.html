<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>رحلة رسالة رومية مع الجواجو😘</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#f3f4ef; --surface:#ffffff; --ink:#1f2a24; --muted:#66706a; --line:#dde1d8;
  --accent:#3d5a46; --accent-soft:#e3ebe2; --gold:#a8843a; --done:#3d7a52;
  --display:"Amiri","Noto Naskh Arabic",serif;
  --body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141a16; --surface:#1c241f; --ink:#e7ebe5; --muted:#9aa49d; --line:#2e3832;
  --accent:#9cc3a6; --accent-soft:#25332a; --gold:#d6b46a; --done:#7fc597; color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141a16; --surface:#1c241f; --ink:#e7ebe5; --muted:#9aa49d; --line:#2e3832;--accent:#9cc3a6; --accent-soft:#25332a; --gold:#d6b46a; --done:#7fc597; color-scheme:dark}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.7}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:28px 48px;display:grid;gap:28px}
header{display:grid;gap:4px}
.eyebrow{font-size:13px;color:var(--gold);font-weight:600}
h1{font-family:var(--display);font-size:36px;line-height:1.25;margin:0;text-wrap:balance}
.sub{color:var(--muted);margin:0}
.progress{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);margin-top:10px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--done);width:0;transition:width .4s}
.today{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;display:grid;gap:14px}
.today .lbl{font-size:13px;color:var(--muted)}
.headline{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.today .num{font-family:var(--display);font-size:56px;line-height:1;color:var(--accent)}
.today .theme{font-family:var(--display);font-size:22px;margin:0}
.verse{font-family:var(--display);font-size:18px;color:var(--muted);border-inline-start:3px solid var(--gold);padding-inline-start:12px;margin:0}
.actions{display:flex;flex-wrap:wrap;gap:10px}
button,.link{font:inherit;font-weight:600;border-radius:10px;padding:10px 18px;cursor:pointer;text-decoration:none;border:1px solid var(--accent)}
.primary{background:var(--accent);color:var(--surface)}
.primary.on{background:var(--done);border-color:var(--done)}
.link{background:transparent;color:var(--accent)}
button:focus-visible,.link:focus-visible,.day:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
h2{font-family:var(--display);font-size:24px;margin:0}
.hint{font-size:14px;color:var(--muted);margin:0}
.days{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.day{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:10px 6px;border-bottom:1px solid var(--line);cursor:pointer;border-radius:8px;user-select:none}
.day:hover{background:var(--accent-soft)}
.day .n{font-family:var(--display);font-size:24px;text-align:center;color:var(--muted)}
.day.cur{background:var(--accent-soft);border-bottom-color:transparent}
.day.cur .n{color:var(--accent);font-weight:700}
.day .t{min-width:0}
.day .t b{display:block;font-weight:500}
.day .t small{color:var(--muted);font-size:13px}
.check{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:15px;color:var(--surface)}
.day.done .check{background:var(--done);border-color:var(--done)}
.day.done .t b{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line)}
.done-all{background:var(--accent-soft);border-radius:14px;padding:18px;text-align:center;font-family:var(--display);font-size:22px}
footer{display:flex;justify-content:center}
.reset{background:transparent;border-color:var(--line);color:var(--muted);font-weight:500;font-size:14px;padding:6px 14px}
/* رسالة التهنئة المنبثقة */
.celebrate{position:fixed;inset:0;background:rgba(20,26,22,.55);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);display:grid;place-items:center;padding:24px;z-index:50;animation:fade .25s ease}
.celebrate[hidden]{display:none}
.celebrate-card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:28px 24px;max-width:380px;width:100%;text-align:center;display:grid;gap:16px;box-shadow:0 20px 60px rgba(0,0,0,.28);animation:pop .35s cubic-bezier(.2,.8,.3,1.2)}
.celebrate-emoji{font-size:54px;line-height:1}
.celebrate-msg{font-family:var(--display);font-size:22px;line-height:1.55;margin:0;color:var(--ink)}
.celebrate-card.birthday{border-color:var(--gold);box-shadow:0 20px 60px rgba(168,132,58,.35)}
.celebrate-card.birthday .celebrate-emoji{font-size:64px}
.celebrate-card.birthday .celebrate-msg{color:var(--accent)}
.confetti{position:fixed;top:-14px;width:9px;height:14px;border-radius:2px;z-index:60;pointer-events:none;animation:fall linear forwards}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.85) translateY(10px)}to{opacity:1;transform:none}}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:.9}}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}.celebrate,.celebrate-card{animation:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="eyebrow">إصحاح كل يوم · ١٦ يوم</span>
    <h1>رسالة بولس الرسول إلى أهل رومية</h1>
    <p class="sub" id="range"></p>
    <div class="progress"><span id="count"></span><span id="pct"></span></div>
    <div class="bar" aria-hidden="true"><i id="prog"></i></div>
  </header>

  <div class="done-all" id="doneAll" hidden>خلّصت رسالة رومية كلها 🎉 مجدًا لله</div>

  <section class="today" aria-live="polite">
    <span class="lbl" id="todayLbl"></span>
    <div class="headline">
      <span class="num" id="todayNum"></span>
      <p class="theme" id="todayTheme"></p>
    </div>
    <p class="verse" id="todayVerse"></p>
    <div class="actions">
      <button class="primary" id="mark" type="button"></button>
      <a class="link" id="readLink" target="_blank" rel="noopener">اقرا الإصحاح</a>
    </div>
  </section>

  <section style="display:grid;gap:10px">
    <h2>الخطة</h2>
    <p class="hint">دوس على أي إصحاح علشان تعلّم عليه أو تشيل العلامة.</p>
    <ol class="days" id="days"></ol>
  </section>

  <footer><button class="reset" id="reset" type="button">ابدأ من الأول</button></footer>
</div>

<div class="celebrate" id="celebrate" hidden>
  <div class="celebrate-card" role="dialog" aria-modal="true" aria-live="assertive">
    <div class="celebrate-emoji" id="celebrateEmoji">💚</div>
    <p class="celebrate-msg" id="celebrateMsg"></p>
    <button class="primary" id="celebrateClose" type="button">تمام 💚</button>
  </div>
</div>

<script>
// ===== الإعدادات =====
const START = new Date(2026, 9, 11);   // تاريخ البداية: 11 أكتوبر 2026 (الشهر بيبدأ من 0)
const KEY = "romans-reading-v1";        // مفتاح الحفظ في المتصفح

const CH = [
 ["الإنجيل قوة الله للخلاص","لأني لست أستحي بإنجيل المسيح"],
 ["دينونة الله العادلة للجميع","لأن ليس عند الله محاباة"],
 ["الكل أخطأوا، والتبرير بالإيمان","متبررين مجانًا بنعمته"],
 ["إيمان إبراهيم","فآمن إبراهيم بالله فحُسب له برًا"],
 ["سلام مع الله، آدم والمسيح","لنا سلام مع الله بربنا يسوع المسيح"],
 ["أموات عن الخطية، أحياء لله","احسبوا أنفسكم أمواتًا عن الخطية"],
 ["الناموس والصراع الداخلي","ويحي أنا الإنسان الشقي"],
 ["لا دينونة، وروح الله فينا","إن كان الله معنا فمن علينا"],
 ["اختيار الله وإسرائيل","ليس لمن يشاء ولا لمن يسعى بل لله الذي يرحم"],
 ["الخلاص بالإيمان للجميع","الإيمان بالخبر والخبر بكلمة الله"],
 ["البقية وغصن الزيتون","يا لعمق غنى الله وحكمته وعلمه"],
 ["ذبيحة حية ومحبة عملية","لا تشاكلوا هذا الدهر"],
 ["السلاطين، والمحبة تكميل الناموس","المحبة هي تكميل الناموس"],
 ["الضعيف والقوي في الإيمان","لأن ليس أحد منا يعيش لذاته"],
 ["احتمال بعضنا، وخطط بولس","اقبلوا بعضكم بعضًا كما أن المسيح قبلنا"],
 ["التحيات والختام","نعمة ربنا يسوع المسيح معكم"]
];

// رسالة تهنئة مختلفة لكل إصحاح لما جوجو تخلصه · آخر واحدة (١٦) هدية عيد الميلاد
const MSG = [
 "شاطر يا جوجو 😘 بابا يسوع بيحبك اوي!",
 "برافو يا حبيبي ❤️ كل إصحاح بيقرّبك ليه أكتر",
 "جامد يا جوجو ✨ ربنا فرحان بيك النهاردة",
 "تسلم إيدك اللي بتقلب الكلمة يا بوغاشة انت 🌙 إيمانك زي إبراهيم",
 "عندك سلام مع ربنا يا حبيبي 🕊️ إنت شاطر اوي",
 "إنت حيّ لله يا جوجو ❤️ وده أحلى حاجة في الدنيا",
 "ماتخافش من أي صراع يا حبيبي 💪 روح ربنا جواك بتسندك",
 "محدش يقدر يفصلك عن محبة بابا يسوع يا جوجو 🥰",
 "ربنا اختارك إنت بالذات يا حبيبي 🌸 إنت غالي عنده",
 "إيمانك بيزيد وإنت بتسمع كلمته يا جوجو 📖 شاطر اوي",
 " محبة ربنا ليك يا جوجو حاجة جميلة اوى 💚 كمّل يا بطل",
 "قدّم قلبك ذبيحة حية يا جوجو 🙏 وربنا هيفرح بيك اوي",
 "المحبة والحنية والطيبة اللي جواك دي من ربنا يا حبيبي 🌟 نوّر بيها",
 "اقبل نفسك زي ما ربنا قابلك يا جوجو ❤️ إنت جميل اوي، وده أهم حاجة",
 "فاضل إصحاح واحد بس يا حبيبي 🎈 إنت قرّبت اوي! ياجاوجو",
 "كل سنة وانت طيب يا جوجو 🎂 خلّصت قراية السفر كلو! كنت عايزة نخلص عشان يبقى عيد ميلاد مختلف، سنة تكون مليانة بفرح وسلام يا حبيبي، بحبك ❤️❤️🫂"
];

const AR = n => String(n).replace(/\d/g, d => "٠١٢٣٤٥٦٧٨٩"[d]);
const fmt = d => d.toLocaleDateString("ar-EG", {weekday:"long", day:"numeric", month:"long"});
const dayOf = i => { const d = new Date(START); d.setDate(d.getDate() + i); return d; };
const link = n => `https://www.biblegateway.com/passage/?search=Romans+${n}&version=NAV`;

// ===== الحفظ =====
function load(){
  try { return new Set(JSON.parse(localStorage.getItem(KEY) || "[]")); }
  catch(e){ return new Set(); }
}
function save(){
  try { localStorage.setItem(KEY, JSON.stringify([...done])); } catch(e){}
}
let done = load();

function todayIndex(){
  const t = new Date(); t.setHours(0,0,0,0);
  return Math.round((t - START) / 86400000);
}

function toggle(n){
  const wasDone = done.has(n);
  wasDone ? done.delete(n) : done.add(n);
  save(); render();
  if (!wasDone) celebrate(n);   // الرسالة تطلع بس لما نعلّم إننا قرينا
}

function confetti(){
  if (matchMedia("(prefers-reduced-motion:reduce)").matches) return;
  const colors = ["#a8843a","#3d7a52","#9cc3a6","#d6b46a","#e3ebe2","#3d5a46"];
  for (let i = 0; i < 90; i++){
    const c = document.createElement("i");
    c.className = "confetti";
    c.style.left = Math.random() * 100 + "vw";
    c.style.background = colors[i % colors.length];
    c.style.animationDelay = (Math.random() * .6) + "s";
    c.style.animationDuration = (2 + Math.random() * 1.6) + "s";
    document.body.append(c);
    setTimeout(() => c.remove(), 4500);
  }
}

function celebrate(n){
  const isBday = n === 16;
  document.getElementById("celebrateMsg").textContent = MSG[n-1];
  document.getElementById("celebrateEmoji").textContent = isBday ? "🎂" : "💚";
  document.querySelector(".celebrate-card").classList.toggle("birthday", isBday);
  document.getElementById("celebrate").hidden = false;
  if (isBday) confetti();
}

function closeCelebrate(){ document.getElementById("celebrate").hidden = true; }

function render(){
  const idx = todayIndex();
  const ch = Math.min(Math.max(idx + 1, 1), 16);

  document.getElementById("range").textContent = `من ${fmt(START)} لحد ${fmt(dayOf(15))}`;
  document.getElementById("count").textContent = `قريت ${AR(done.size)} من ${AR(16)}`;
  document.getElementById("pct").textContent = AR(Math.round(done.size / 16 * 100)) + "٪";
  document.getElementById("prog").style.width = (done.size / 16 * 100) + "%";
  document.getElementById("doneAll").hidden = done.size < 16;

  document.getElementById("todayLbl").textContent =
    idx < 0 ? "أول قراية" : idx > 15 ? "آخر إصحاح في الخطة" : `قراءة النهارده · ${fmt(dayOf(idx))}`;
  document.getElementById("todayNum").textContent = AR(ch);
  document.getElementById("todayTheme").textContent = CH[ch-1][0];
  document.getElementById("todayVerse").textContent = "«" + CH[ch-1][1] + "»";
  document.getElementById("readLink").href = link(ch);

  const btn = document.getElementById("mark");
  const isDone = done.has(ch);
  btn.classList.toggle("on", isDone);
  btn.textContent = isDone ? "✓ قريته" : "علّم إنك قريت";
  btn.onclick = () => toggle(ch);

  const ol = document.getElementById("days");
  ol.replaceChildren();
  CH.forEach(([theme], i) => {
    const n = i + 1;
    const li = document.createElement("li");
    li.className = "day" + (n === ch ? " cur" : "") + (done.has(n) ? " done" : "");
    li.tabIndex = 0;
    li.setAttribute("role", "checkbox");
    li.setAttribute("aria-checked", done.has(n));
    li.innerHTML = `<span class="n">${AR(n)}</span>
      <div class="t"><b></b><small>${fmt(dayOf(i))}</small></div>
      <span class="check">${done.has(n) ? "✓" : ""}</span>`;
    li.querySelector("b").textContent = theme;
    li.onclick = () => toggle(n);
    li.onkeydown = e => { if (e.key === " " || e.key === "Enter"){ e.preventDefault(); toggle(n); } };
    ol.append(li);
  });
}

document.getElementById("reset").addEventListener("click", e => {
  const b = e.currentTarget;
  if (b.dataset.confirm){ done = new Set(); save(); render(); b.textContent = "ابدأ من الأول"; delete b.dataset.confirm; }
  else { b.dataset.confirm = "1"; b.textContent = "متأكد؟ دوس تاني علشان تمسح العلامات يا جوجو😘"; }
});

document.getElementById("celebrateClose").addEventListener("click", closeCelebrate);
document.getElementById("celebrate").addEventListener("click", e => {
  if (e.target.id === "celebrate") closeCelebrate();   // الدوس بره الكارت بيقفل
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && !document.getElementById("celebrate").hidden) closeCelebrate();
});

render();
</script>
</body>
</html>
